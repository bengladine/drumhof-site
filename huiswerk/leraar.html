<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Huiswerk – leraar</title>
<link rel="icon" href="/img/favicon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="manifest" href="leraar.webmanifest">
<meta name="theme-color" content="#f6f4ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Drumhof">
<style>
  :root {
    --bg: #f6f4ef; --card: #fff; --ink: #1d1d1b; --muted: #6b6860;
    --accent: #e4572e; --ok: #2e9e5b; --line: #e3dfd6; --radius: 16px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 16px 14px 64px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  h1 { font-size: 1.5rem; margin: 8px 0; }
  h2 { font-size: 1.15rem; margin: 0; }
  .muted { color: var(--muted); }
  .small { font-size: .85rem; }
  .card { background: var(--card); border-radius: var(--radius); padding: 14px 16px;
          margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  button, .btn { font: inherit; font-weight: 700; border-radius: 10px; padding: 9px 14px; cursor: pointer;
                 border: 2px solid var(--ink); background: #fff; color: var(--ink); text-decoration: none;
                 display: inline-block; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.ghost { border-color: transparent; background: transparent; padding: 6px 8px; }
  button.danger { border-color: #b3261e; color: #b3261e; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .student-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .hw-list { list-style: none; margin: 10px 0 0; padding: 0; }
  .hw-list li { display: flex; align-items: center; justify-content: space-between; gap: 8px;
                border-top: 1px solid var(--line); padding: 8px 0; }
  label { display: block; font-weight: 600; font-size: .9rem; margin: 10px 0 4px; }
  label .muted { font-weight: 400; }
  input, textarea, select { width: 100%; font: inherit; padding: 9px 10px; border: 2px solid var(--line);
                            border-radius: 10px; background: #fff; color: var(--ink); }
  textarea { min-height: 70px; resize: vertical; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--ink); }
  fieldset { border: 2px solid var(--line); border-radius: 14px; padding: 6px 14px 14px; margin: 14px 0; }
  legend { font-weight: 800; padding: 0 6px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  @media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 10; overflow: auto; padding: 16px 10px; }
  .sheet { max-width: 680px; margin: 0 auto; background: var(--bg); border-radius: var(--radius); padding: 16px; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ok); color: #fff;
           padding: 12px 18px; border-radius: 12px; font-weight: 700; z-index: 20; max-width: 92vw; }
  pre { background: #1d1d1b; color: #f6f4ef; padding: 12px; border-radius: 10px; overflow: auto; font-size: .8rem; }
  .error { color: #b3261e; font-weight: 600; }
  .chip { display: inline-block; font-size: .8rem; font-weight: 700; padding: 2px 8px; border-radius: 99px;
          background: var(--line); color: var(--ink); white-space: nowrap; }
  .chip.owe { background: #fde3dd; color: #b3261e; }
  .chip.credit { background: #dcf1e4; color: #1f6e40; }
  .money { margin-top: 12px; border-top: 2px solid var(--line); padding-top: 10px; }
  .money h3 { font-size: 1rem; margin: 0; }
  .ledger { list-style: none; margin: 8px 0 0; padding: 0; font-size: .92rem; }
  .ledger li { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center;
               border-top: 1px solid var(--line); padding: 6px 0; }
  .ledger .bal { font-variant-numeric: tabular-nums; min-width: 64px; text-align: right; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin: 8px 0; }
  .stat { background: var(--bg); border-radius: 12px; padding: 8px 10px; }
  .stat b { display: block; font-size: 1.2rem; }
  .check { display: flex; gap: 8px; align-items: center; font-weight: 700; margin: 4px 0; }
  .check input { width: auto; }
  .practice { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 4px; font-weight: 400; }
  .pdots { display: inline-flex; gap: 3px; }
  .pday { width: 10px; height: 10px; border-radius: 3px; background: var(--line); }
  .pday.on { background: var(--ok); }
  .pday.seen { background: #b9dcc7; }
  .thread { border-top: 1px solid var(--line); padding: 8px 0; }
  .tmsg { border-radius: 10px; padding: 6px 10px; margin: 6px 0; max-width: 92%; }
  .tmsg.them { background: #efe9dc; }
  .tmsg.me { background: #e3f1e8; margin-left: auto; }
  .tmsg .ghost { padding: 0 4px; float: right; }
  .tmsg-text { white-space: pre-wrap; }
  .tabbar { position: sticky; top: 0; z-index: 5; display: flex; gap: 4px; overflow-x: auto;
            background: var(--ink); padding: 6px 8px 0; }
  .tabbar[hidden], .frames[hidden], iframe[hidden], main[hidden] { display: none; }
  .tab { display: inline-flex; align-items: center; flex: 0 0 auto; border-radius: 10px 10px 0 0;
         background: #3a3a37; color: #f6f4ef; border: 0; font: inherit; font-weight: 700; padding: 8px 14px; cursor: pointer; }
  span.tab { padding: 0; }
  .tab.active { background: var(--bg); color: var(--ink); }
  .tab button { border: 0; background: transparent; color: inherit; font: inherit; font-weight: 700; cursor: pointer; }
  .tab-name { padding: 8px 4px 8px 14px; }
  .tab-x { padding: 8px 12px 8px 6px; opacity: .7; }
  .tab-x:hover { opacity: 1; }
  .frames iframe { display: block; width: 100%; height: calc(100vh - 42px); border: 0; background: var(--bg); }
  .pday.today { outline: 2px solid var(--ink); outline-offset: 1px; }
</style>
</head>
<body>
<main id="app"><p class="muted">Laden…</p></main>

<script type="module">
import { firebaseConfig } from "./firebase-config.js";

const FB = "https://www.gstatic.com/firebasejs/10.14.1/";
const SITE = location.origin + location.pathname.replace(/[^/]*$/, ""); // …/huiswerk/
const OLD = "https://bengladine.github.io/drumhomework/";
// Students that already have a page on the old GitHub site (for the one-time import)
const OLD_STUDENTS = ["oji", "casper", "clea", "fjore", "bram", "frank", "marie", "ben", "voorbeeld"];
const TYPES = ["Techniek", "Rudiment", "Groove", "Fill", "Groove + fill", "Song", "Lezen", "Coördinatie"];

const app = document.getElementById("app");
let auth, db, A, F, user = null;
let students = []; // [{id, name, lang, homework: [{id, ...}], priv: {price, duration, opening}, entries: [...]}]
const open = {};   // which students are unfolded
const showAll = {}; // which students show their full ledger
let ledgerOK = true; // false while the Firestore rules don't cover the private (money) data yet
let progressOK = true; // false while the Firestore rules don't cover the practice ticks (progress/<id>) yet
let msgOK = true;      // false while the Firestore rules don't cover messages (progress/<id>/messages) yet
const replyOpen = {};  // message id → reply box open
let progress = {};     // id → { days: ["2026-11-24", …], tempos, updated } as saved by the student's page
const DURATIONS = [30, 45, 60, 90, 120];
const METHODS = ["Cash", "Overschrijving", "Payconiq", "Andere"];

// ---------- helpers ----------
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const k in attrs || {}) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k === "value") n.value = v;
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) n.append(k);
  return n;
}
const lines = s => (s || "").split("\n").map(x => x.trim()).filter(Boolean);
const slug = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]/g, "");
const pad = n => String(n).padStart(2, "0");
const todayISO = () => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
const studentLink = s => SITE + "?s=" + s.id;
function dateLabel(iso, lang) {
  const d = new Date(iso.slice(0, 10) + "T12:00:00");
  if (isNaN(d)) return iso;
  return d.toLocaleDateString(lang === "en" ? "en-GB" : "nl-BE", { day: "numeric", month: "short" }).replace(".", "");
}
function toast(msg) {
  const t = el("div", { class: "toast" }, msg);
  document.body.append(t);
  setTimeout(() => t.remove(), 3500);
}
async function copy(text, msg) {
  try { await navigator.clipboard.writeText(text); toast(msg || "Gekopieerd ✓"); }
  catch (e) { prompt("Kopieer:", text); }
}
// ---------- money ----------
const num = v => { const n = parseFloat(String(v ?? "").replace(",", ".")); return isFinite(n) ? n : 0; };
const eur = n => "€" + (Math.round(n * 100) / 100).toLocaleString("nl-BE", { minimumFractionDigits: Number.isInteger(n) ? 0 : 2, maximumFractionDigits: 2 });
// Saldo: what they paid minus what their lessons cost. Positive = credit (tegoed), negative = they owe you.
function balance(s) {
  return num(s.priv.opening) + s.entries.reduce((t, e) => t + num(e.paid) - num(e.price), 0);
}
function balanceChip(s) {
  const b = balance(s);
  if (Math.abs(b) < 0.005) return el("span", { class: "chip" }, "Saldo €0");
  return b > 0 ? el("span", { class: "chip credit" }, "Tegoed " + eur(b))
               : el("span", { class: "chip owe" }, "Te betalen " + eur(-b));
}
function balanceText(b) {
  if (Math.abs(b) < 0.005) return "€0";
  return b > 0 ? "+" + eur(b) : "−" + eur(-b);
}

// Tempo steps from a Drumsheet link: ~70% → ~85% → the tempo in the link, rounded to 5
function tempoSteps(url) {
  const t = +((url.match(/[?&]Tempo=(\d+)/) || [])[1]);
  if (!t) return [];
  const r5 = x => Math.max(30, Math.round(x / 5) * 5);
  return [...new Set([r5(t * 0.7), r5(t * 0.85), t])].sort((a, b) => a - b);
}

// ---------- tabs: student pages open inside the teacher page ----------
// The list stays the first tab; each "Bekijk" adds a tab with that student's page (read-only view).
// Pages stay loaded while you switch, so a playing groove or scroll position isn't lost.
const tabs = [];       // [{ id, name, frame }]
let activeTab = null;  // null = the student list
const tabbar = el("nav", { class: "tabbar", hidden: true });
const frames = el("div", { class: "frames", hidden: true });
document.body.prepend(tabbar);
document.body.append(frames);
function openTab(s) {
  let t = tabs.find(x => x.id === s.id);
  if (!t) {
    t = { id: s.id, name: s.name || s.id,
          frame: el("iframe", { src: studentLink(s) + "&leraar=1", title: s.name || s.id }) };
    tabs.push(t);
    frames.append(t.frame);
  }
  showTab(t.id);
}
function closeTab(id) {
  const i = tabs.findIndex(x => x.id === id);
  if (i < 0) return;
  tabs[i].frame.remove();
  tabs.splice(i, 1);
  showTab(activeTab === id ? (tabs[i] || tabs[i - 1] || {}).id || null : activeTab);
}
function showTab(id) {
  activeTab = id;
  app.hidden = id != null;
  frames.hidden = id == null;
  tabs.forEach(t => { t.frame.hidden = t.id !== id; });
  tabbar.hidden = !tabs.length;
  tabbar.textContent = "";
  tabbar.append(el("button", { class: "tab" + (id == null ? " active" : ""), onclick: () => showTab(null) }, "Leerlingen"),
    ...tabs.map(t => el("span", { class: "tab" + (t.id === id ? " active" : "") },
      el("button", { class: "tab-name", onclick: () => showTab(t.id) }, t.name),
      el("button", { class: "tab-x", title: "Sluiten", "aria-label": "Tab sluiten", onclick: () => closeTab(t.id) }, "×"))));
}
// Ctrl+W-like: Escape goes back to the list
document.addEventListener("keydown", e => { if (e.key === "Escape" && activeTab != null) showTab(null); });

// ---------- screens ----------
function screen(...kids) { app.textContent = ""; app.append(...kids.filter(k => k != null && k !== false)); }

function setupScreen() {
  screen(el("h1", null, "Huiswerk – leraar"),
    el("div", { class: "card" },
      el("p", null, el("strong", null, "De database is nog niet gekoppeld.")),
      el("p", { class: "muted" }, "Maak een Firebase-project aan en stuur de config door (zie README in de huiswerk-map). Tot dan lezen de leerlingenpagina's nog de oude bestanden op GitHub.")));
}

function signInScreen(err) {
  screen(el("h1", null, "Huiswerk – leraar"),
    el("div", { class: "card" },
      el("p", null, "Log in met je Google-account om huiswerk toe te voegen."),
      el("button", { class: "primary", onclick: signIn }, "Inloggen met Google"),
      err ? el("p", { class: "error" }, err) : null));
}

function rulesText(email) {
  return `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function isTeacher() {
      return request.auth != null
        && request.auth.token.email_verified == true
        && request.auth.token.email.lower() == "${email.toLowerCase()}";
    }
    // Drum homework: a student opens their own page by link; only the teacher writes
    match /students/{student} {
      allow get: if true;
      allow list, write: if isTeacher();
      match /homework/{id} {
        allow read: if true;
        allow write: if isTeacher();
      }
    }
    // Practice ticks: the student's page saves them by link (no account), only for existing students
    match /progress/{student} {
      allow get: if true;
      allow list, delete: if isTeacher();
      allow create, update: if exists(/databases/$(database)/documents/students/$(student))
        && request.resource.data.keys().hasOnly(["days", "tempos", "opened", "updated"])
        && request.resource.data.days is list && request.resource.data.days.size() <= 3000
        && request.resource.data.tempos is map;
      // Questions/notes from the student page, replies from the teacher
      match /messages/{id} {
        allow read: if true;
        allow create: if exists(/databases/$(database)/documents/students/$(student))
          && request.resource.data.keys().hasOnly(["from", "text", "ex", "exTitle", "at"])
          && request.resource.data.text is string && request.resource.data.text.size() <= 1000
          && (request.resource.data.from == "student" || (request.resource.data.from == "teacher" && isTeacher()));
        allow update, delete: if isTeacher();
      }
    }
    // Boekhouding (rates, lessons, payments): only the teacher can read or write
    match /private/{document=**} {
      allow read, write: if isTeacher();
    }
  }
}`;
}

function rulesScreen() {
  const txt = rulesText(user.email);
  screen(el("h1", null, "Nog één stap"),
    el("div", { class: "card" },
      el("p", null, "Je bent ingelogd als ", el("strong", null, user.email), ", maar de database laat je nog niet schrijven."),
      el("ol", null,
        el("li", null, "Kopieer de regels hieronder."),
        el("li", null, "Firebase console → Firestore Database → tab ", el("strong", null, "Rules"), " → alles vervangen → ", el("strong", null, "Publish"), "."),
        el("li", null, "Wacht een halve minuut en herlaad deze pagina.")),
      el("div", { class: "row" },
        el("button", { class: "primary", onclick: () => copy(txt, "Regels gekopieerd ✓") }, "Regels kopiëren"),
        el("button", { onclick: () => location.reload() }, "Herladen"),
        el("button", { class: "ghost", onclick: () => A.signOut(auth) }, "Uitloggen")),
      el("pre", null, txt)));
}

function mainScreen() {
  const head = el("header", null,
    el("h1", null, "Huiswerk"),
    el("div", { class: "row small muted" }, user.email,
      el("button", { class: "ghost", onclick: () => A.signOut(auth) }, "Uitloggen")));

  const list = el("div");
  if (!students.length) {
    list.append(el("div", { class: "card" },
      el("p", null, el("strong", null, "Nog geen leerlingen in de database.")),
      el("p", { class: "muted" }, "Haal je huidige leerlingen en hun huiswerk één keer over van de oude GitHub-pagina's (" + OLD_STUDENTS.join(", ") + ")."),
      el("button", { class: "primary", onclick: importOld }, "Bestaande leerlingen importeren")));
  }
  for (const s of students) list.append(studentCard(s));

  screen(head, !ledgerOK || !progressOK || !msgOK ? rulesBanner() : null, ledgerOK ? overviewCard() : null, list,
    el("div", { class: "row", style: "margin-top:8px" },
      el("button", { onclick: addStudentForm }, "＋ Leerling")));
}

function rulesBanner() {
  const txt = rulesText(user.email);
  return el("div", { class: "card" },
    !ledgerOK
      ? el("p", null, el("strong", null, "Boekhouding: nog één stap."), " De database-regels moeten bijgewerkt worden zodat alleen jij de betalingen kan zien.")
      : !progressOK
      ? el("p", null, el("strong", null, "Oefendagen: nog één stap."), " De database-regels moeten bijgewerkt worden zodat leerlingen hun oefendagen kunnen bewaren en jij ze hier ziet.")
      : el("p", null, el("strong", null, "Berichten: nog één stap."), " De database-regels moeten bijgewerkt worden zodat leerlingen je een vraag kunnen sturen en jij kan antwoorden."),
    el("p", { class: "small muted" }, "Firebase console → Firestore Database → Rules → alles vervangen → Publish → even wachten → herladen."),
    el("div", { class: "row" },
      el("button", { class: "primary", onclick: () => copy(txt, "Regels gekopieerd ✓") }, "Regels kopiëren"),
      el("button", { onclick: () => location.reload() }, "Herladen")));
}

function overviewCard() {
  const now = new Date();
  const ym = now.getFullYear() + "-" + pad(now.getMonth() + 1);
  // school year starts 1 September
  const syStart = (now.getMonth() >= 8 ? now.getFullYear() : now.getFullYear() - 1) + "-09-01";
  let owed = 0, nOwe = 0, credit = 0, paidMonth = 0, lessonsMonth = 0, paidYear = 0;
  for (const s of students) {
    const b = balance(s);
    if (b < -0.005) { owed -= b; nOwe++; } else if (b > 0.005) credit += b;
    for (const e of s.entries) {
      if ((e.date || "").startsWith(ym)) { paidMonth += num(e.paid); if (num(e.price) > 0) lessonsMonth++; }
      if ((e.date || "") >= syStart) paidYear += num(e.paid);
    }
  }
  return el("section", { class: "card" },
    el("div", { class: "student-head" }, el("h2", null, "Boekhouding"),
      el("button", { class: "ghost small", onclick: exportCSV }, "⬇︎ CSV")),
    el("div", { class: "stats" },
      el("div", { class: "stat" }, el("span", { class: "small muted" }, "Te innen"), el("b", { style: owed ? "color:#b3261e" : "" }, eur(owed)),
        el("span", { class: "small muted" }, nOwe ? nOwe + " leerling" + (nOwe === 1 ? "" : "en") : "niemand")),
      el("div", { class: "stat" }, el("span", { class: "small muted" }, "Tegoed (vooraf betaald)"), el("b", null, eur(credit))),
      el("div", { class: "stat" }, el("span", { class: "small muted" }, "Ontvangen deze maand"), el("b", null, eur(paidMonth)),
        el("span", { class: "small muted" }, lessonsMonth + " les" + (lessonsMonth === 1 ? "" : "sen"))),
      el("div", { class: "stat" }, el("span", { class: "small muted" }, "Ontvangen dit schooljaar"), el("b", null, eur(paidYear)))));
}

function exportCSV() {
  const q = v => { const t = String(v ?? ""); return /[;"\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
  const dec = n => num(n) ? String(num(n)).replace(".", ",") : "";
  const rows = [["Datum", "Leerling", "Duur (min)", "Lesprijs", "Betaald", "Methode", "Notitie"]];
  const all = [];
  for (const s of students) for (const e of s.entries) all.push([e.date, s.name || s.id, e.duration || "", dec(e.price), dec(e.paid), e.method || "", e.note || ""]);
  all.sort((a, b) => (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0));
  const csv = "﻿" + rows.concat(all).map(r => r.map(q).join(";")).join("\r\n");
  const a = el("a", { href: URL.createObjectURL(new Blob([csv], { type: "text/csv" })), download: "boekhouding-drumhof-" + todayISO() + ".csv" });
  document.body.append(a); a.click(); a.remove();
}

function ledgerSection(s) {
  if (!ledgerOK) return null;
  // running balance, oldest → newest
  const asc = s.entries.slice().reverse();
  let run = num(s.priv.opening);
  const runAfter = new Map();
  for (const e of asc) { run += num(e.paid) - num(e.price); runAfter.set(e.id, run); }
  const shown = showAll[s.id] ? s.entries : s.entries.slice(0, 6);
  const rate = s.priv.price ? eur(num(s.priv.price)) + " / " + (s.priv.duration || 60) + " min" : "nog geen tarief";
  return el("div", { class: "money" },
    el("div", { class: "student-head" },
      el("h3", null, "Lessen & betalingen ", el("span", { class: "small muted", style: "font-weight:400" }, "· " + rate)),
      el("div", { class: "row" },
        el("button", { onclick: () => entryForm(s, null, "les") }, "＋ Les"),
        el("button", { onclick: () => entryForm(s, null, "betaling") }, "＋ Betaling"))),
    el("ul", { class: "ledger" },
      shown.length ? shown.map(e => {
        const parts = [];
        if (num(e.price)) parts.push("Les" + (e.duration ? " " + e.duration + " min" : "") + " " + eur(num(e.price)));
        if (num(e.paid)) parts.push("betaald " + eur(num(e.paid)) + (e.method ? " (" + e.method.toLowerCase() + ")" : ""));
        return el("li", null,

// Practice ticks from the student's page: last 14 days as dots, streak, days ticked in the last 7
function practiceRow(s) {
  if (!progressOK) return null;
  const p = progress[s.id];
  const days = new Set((p && p.days) || []);
  const opened = new Set((p && p.opened) || []);
  const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const back = n => { const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() - n); return d; };
  let streak = 0;
  for (let n = days.has(iso(back(0))) ? 0 : 1; days.has(iso(back(n))); n++) streak++;
  let week = 0;
  for (let n = 0; n < 7; n++) if (days.has(iso(back(n)))) week++;
  const dots = [];
  for (let n = 13; n >= 0; n--) {
    const d = back(n);
    const k = iso(d), did = days.has(k), saw = opened.has(k);
    dots.push(el("span", { class: "pday" + (did ? " on" : saw ? " seen" : "") + (n === 0 ? " today" : ""),
      title: d.toLocaleDateString("nl-BE", { weekday: "short", day: "numeric", month: "short" }) +
        (did ? " · geoefend" : saw ? " · app geopend" : "") }));
  }
  const last = [...days].sort().pop();
  const t = iso(back(0));
  const todayChip = days.has(t) ? el("span", { class: "chip credit" }, "✓ vandaag geoefend")
    : opened.has(t) ? el("span", { class: "chip" }, "👀 vandaag geopend") : null;
  return el("div", { class: "practice" },
    todayChip,
    el("span", { class: "pdots", title: "Laatste 14 dagen (rechts = vandaag) · groen = geoefend · licht = app geopend" }, dots),
    el("span", { class: "small muted" },
      !p ? "nog niets aangevinkt"
         : (streak ? "🔥 " + streak + " · " : "") + week + "/7 dagen" + (last ? " · laatst " + dateLabel(last, "nl") : "")));
}

// "Since last lesson": last lesson = newest homework date or newest logged lesson, whichever is later
function lastLessonDate(s) {
  const hw = (s.homework[0] && /^\d{4}-\d{2}-\d{2}/.test(s.homework[0].id)) ? s.homework[0].id.slice(0, 10) : "";
  const les = s.entries.filter(e => num(e.price) > 0 && e.date).map(e => e.date.slice(0, 10)).sort().pop() || "";
  return hw > les ? hw : les;
}
function sinceLesson(s) {
  if (!progressOK) return null;
  const L = lastLessonDate(s);
  if (!L) return null;
  const p = progress[s.id] || {};
  const practiced = (p.days || []).filter(d => d > L).length;
  const opened = (p.opened || []).filter(d => d > L).length;
  // goals of the newest homework (same ids and "done" logic as the student page)
  const h = s.homework[0], tick = (p.tempos || {});
  let goals = "";
  if (h) {
    const exs = Array.isArray(h.exercises) ? h.exercises : [h];
    const ids = Array.isArray(h.exercises) ? exs.map((ex, i) => h.id + "/" + (ex.id || i)) : [h.id];
    const isDone = (ex, id) => { const t = (ex.tempos && ex.tempos.length) ? ex.tempos : ["done"]; return t.every(x => (tick[id] || []).includes(x)); };
    goals = exs.filter((ex, i) => isDone(ex, ids[i])).length + "/" + exs.length + " doelen gehaald";
  }
  return el("div", { class: "small", style: "font-weight:400;margin-top:2px" },
    el("strong", null, "Sinds les " + dateLabel(L, "nl") + ": "),
    practiced + "× geoefend · " + opened + "× geopend" + (goals ? " · " + goals : ""));
}

// Messages: unread = student messages after the time you last opened this student's card
function msgSeenAt(s) {
  if (ledgerOK && s.priv && s.priv.msgSeen) return s.priv.msgSeen;
  try { return localStorage.getItem("leraar-msgseen:" + s.id) || ""; } catch (e) { return ""; }
}
function markMsgsSeen(s) {
  const last = (s.msgs || []).filter(m => m.from === "student").map(m => m.at).sort().pop();
  if (!last || last <= msgSeenAt(s)) return;
  try { localStorage.setItem("leraar-msgseen:" + s.id, last); } catch (e) {}
  if (ledgerOK) { s.priv.msgSeen = last; F.setDoc(F.doc(db, "private", s.id), { msgSeen: last }, { merge: true }).catch(e => console.warn(e)); }
}
const unreadCount = s => (s.msgs || []).filter(m => m.from === "student" && m.at > msgSeenAt(s)).length;
const timeLabel = iso => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleDateString("nl-BE", { day: "numeric", month: "short" }) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()); };

function messagesSection(s, seen) {

  // group by exercise, newest thread first

  const ordered = [...threads.values()].sort((a, b) => (a[a.length - 1].at < b[b.length - 1].at ? 1 : -1));
  for (const th of ordered) {

      send.addEventListener("click", async () => {

          delete replyOpen[key]; open[s.id] = true; await reload(); toast("Antwoord verstuurd ✓");
        } catch (e) { send.disabled = false; alert("Versturen mislukt: " + e.message); }
      });
      box.append(ta, el("div", { class: "row", style: "margin-top:6px" }, send,
        el("button", { class: "ghost", onclick: () => { delete replyOpen[key]; mainScreen(); } }, "Annuleren")));
      setTimeout(() => ta.focus(), 0);
    } else {

// ---------- add / edit homework ----------
function homeworkForm(s, existing) {
  const en = s.lang === "en";
  const exList = el("div");
  const exercises = existing
    ? (existing.exercises || [existing]) // old one-exercise format becomes one block
    : [{}];

  const date = el("input", { type: "date", value: existing ? existing.id.slice(0, 10) : todayISO() });
  const title = el("input", { value: existing ? existing.title || "" : "",
    placeholder: (en ? "Homework " : "Huiswerk ") + dateLabel(todayISO(), s.lang) });
  const notes = el("textarea", { placeholder: "Eén punt per regel (optioneel)" });
  notes.value = existing && existing.exercises ? [].concat(existing.notes || []).join("\n") : "";
  const err = el("p", { class: "error" });

  function exBlock(ex) {
    const grooves = !ex.groove ? [] : Array.isArray(ex.groove) ? ex.groove : [{ url: ex.groove }];
    const f = {
      type: el("input", { value: ex.type || "", list: "types", placeholder: "bv. Groove" }),
      title: el("input", { value: ex.title || "", placeholder: "bv. Beat met fills" }),
      links: el("textarea", { placeholder: "Plak hier de Drumsheet-link (één per regel als het er meer zijn)" }),
      goal: el("input", { value: ex.goal || "", placeholder: "Leeg = automatisch (vlot op het hoogste tempo)" }),
      tempos: el("input", { value: (ex.tempos || []).join(" "), placeholder: "bv. 60 70 80 — leeg = uit de link" }),
      focus: el("textarea", { placeholder: "Waar moeten ze op letten? Eén punt per regel" }),
      pdf: ex.pdf || null
    };
    f.links.value = grooves.map(g => g.url).join("\n");
    f.focus.value = [].concat(ex.focus || []).join("\n");
    let temposTouched = !!f.tempos.value;
    f.tempos.addEventListener("input", () => { temposTouched = !!f.tempos.value; });
    f.links.addEventListener("input", () => {
      const first = lines(f.links.value)[0] || "";
      if (!temposTouched) f.tempos.value = tempoSteps(first).join(" ");
    });
    const box = el("fieldset", null, el("legend", null, "Oefening"),
      el("div", { class: "grid2" },
        el("div", null, el("label", null, "Soort ", el("span", { class: "muted" }, "(optioneel)")), f.type),
        el("div", null, el("label", null, "Titel"), f.title)),
      el("label", null, "Drumsheet-link"), f.links,
      el("label", null, "Let op / notities"), f.focus,
      el("div", { class: "grid2" },
        el("div", null, el("label", null, "Doel ", el("span", { class: "muted" }, "(optioneel)")), f.goal),
        el("div", null, el("label", null, "Tempo-stappen (bpm)"), f.tempos)),
      f.pdf ? el("p", { class: "small muted" }, "PDF blijft gekoppeld: " + f.pdf) : null,
      el("div", { class: "row", style: "margin-top:10px" },
        el("button", { class: "ghost danger", onclick: () => { box.remove(); blocks.splice(blocks.indexOf(f), 1); renumber(); } }, "Oefening verwijderen")));
    f.box = box;
    return f;
  }
  const blocks = [];
  function addEx(ex) { const f = exBlock(ex); blocks.push(f); exList.append(f.box); renumber(); }
  function renumber() { blocks.forEach((f, i) => { f.box.querySelector("legend").textContent = "Oefening " + (i + 1); }); }
  exercises.forEach(addEx);

  // the lesson + payment that go with this homework (private, only for the teacher)
  const linked = existing ? s.entries.find(e => e.hw === existing.id) : null;
  const money = ledgerOK ? lessonFields(s, linked, !existing || !!linked) : null;

  const saveBtn = el("button", { class: "primary", onclick: save }, existing ? "Opslaan" : "Toevoegen");
  const ov = el("div", { class: "overlay" }, el("div", { class: "sheet" },
    el("h2", null, (existing ? "Huiswerk wijzigen – " : "Huiswerk voor ") + (s.name || s.id)),
    el("datalist", { id: "types" }, TYPES.map(t => el("option", { value: t }))),
    el("div", { class: "grid2" },
      el("div", null, el("label", null, "Datum van de les"), date),
      el("div", null, el("label", null, "Titel ", el("span", { class: "muted" }, "(optioneel)")), title)),
    money ? money.box : null,
    el("label", null, "Algemene notities ", el("span", { class: "muted" }, "(optioneel)")), notes,
    exList,
    el("button", { onclick: () => addEx({}) }, "＋ Oefening"),
    err,
    el("div", { class: "row", style: "margin-top:16px" },
      saveBtn, el("button", { onclick: () => ov.remove() }, "Annuleren"))));
  document.body.append(ov);
  if (!existing) blocks[0].links.focus();

  async function save() {
    err.textContent = "";
    const d = date.value || todayISO();
    const exs = blocks.map((f, i) => {
      const urls = lines(f.links.value);
      const tempos = lines(f.tempos.value.replace(/[,;]/g, " ").replace(/\s+/g, "\n")).map(Number).filter(n => n > 0);
      const max = tempos.length ? Math.max(...tempos) : 0;
      const ex = {
        title: f.title.value.trim() || f.type.value.trim() || (en ? "Exercise " : "Oefening ") + (i + 1),
        goal: f.goal.value.trim() || (max ? (en ? "Play it cleanly at " : "Vlot spelen op ") + max + " bpm"
                                          : (en ? "Play it cleanly" : "Vlot spelen")),
        tempos,
        groove: urls.map((u, j) => urls.length > 1 ? { label: (en ? "Part " : "Deel ") + (j + 1), url: u } : { url: u }),
        focus: lines(f.focus.value)
      };
      if (f.type.value.trim()) ex.type = f.type.value.trim();
      if (f.pdf) ex.pdf = f.pdf;
      return { ex, empty: !urls.length && !ex.focus.length && !f.title.value.trim() && !f.goal.value.trim() };
    }).filter(x => !x.empty).map(x => x.ex);
    if (!exs.length) { err.textContent = "Vul minstens één oefening in (link, titel of notities)."; return; }

    // one homework per lesson date; a second one on the same day gets -2, -3, …
    let id = d;
    const taken = new Set(s.homework.map(h => h.id));
    if (existing) taken.delete(existing.id);
    if (!(existing && existing.id.slice(0, 10) === d)) { let n = 2; while (taken.has(id)) id = d + "-" + n++; }
    else id = existing.id;

    const doc = {
      date: dateLabel(d, s.lang),
      title: title.value.trim() || (en ? "Homework " : "Huiswerk ") + dateLabel(d, s.lang),
      notes: lines(notes.value),
      exercises: exs,
      updated: F.serverTimestamp()
    };
    if (existing && existing.pdf && existing.exercises) doc.pdf = existing.pdf;
    saveBtn.disabled = true;
    try {
      await F.setDoc(F.doc(db, "students", s.id, "homework", id), doc);
      if (existing && existing.id !== id) await F.deleteDoc(F.doc(db, "students", s.id, "homework", existing.id));
      if (money) {
        const entryId = linked ? linked.id : "hw-" + id;
        if (money.on.checked) {
          await F.setDoc(F.doc(db, "private", s.id, "lessen", entryId), Object.assign(money.values(), {
            date: d, hw: id, note: exs.map(e => e.title).join(", ").slice(0, 120), updated: F.serverTimestamp() }));
        } else if (linked) {
          await F.deleteDoc(F.doc(db, "private", s.id, "lessen", linked.id));
        }
      }
      ov.remove();
      open[s.id] = true;
      await reload();
      toast(existing ? "Opgeslagen ✓" : "✓ " + (s.name || s.id) + " ziet het huiswerk nu");
    } catch (e) { saveBtn.disabled = false; err.textContent = "Opslaan mislukt: " + e.message; }
  }
}

async function removeHomework(s, h) {
  if (!confirm("Huiswerk van " + (h.date || h.id) + " voor " + (s.name || s.id) + " verwijderen? Dit kan niet ongedaan gemaakt worden.")) return;
  try { await F.deleteDoc(F.doc(db, "students", s.id, "homework", h.id)); await reload(); toast("Verwijderd"); }

}

// Removes the student everywhere: page + homework, practice ticks, and (teacher-only) lessons & payments.
// Their link stops working. Asks to type the name, since this can't be undone.
async function removeStudent(s, ov) {
  const nm = s.name || s.id;
  const typed = prompt("Leerling " + nm + " verwijderen?\n\nDit wist hun pagina (de link werkt niet meer), al hun huiswerk, " +
    "oefendagen" + (ledgerOK ? " én hun lessen & betalingen (download eventueel eerst de CSV)" : "") +
    ".\nDit kan niet ongedaan gemaakt worden.\n\nTyp de naam \"" + nm + "\" om te bevestigen:");
  if (typed == null) return;
  if (typed.trim().toLowerCase() !== nm.toLowerCase()) { alert("Naam klopt niet — er is niets verwijderd."); return; }
  try {
    const subs = [F.getDocs(F.collection(db, "students", s.id, "homework"))];
    if (msgOK) subs.push(F.getDocs(F.collection(db, "progress", s.id, "messages")));
    if (ledgerOK) subs.push(F.getDocs(F.collection(db, "private", s.id, "lessen")));
    const snaps = await Promise.all(subs);
    await Promise.all(snaps.flatMap(sn => sn.docs.map(d => F.deleteDoc(d.ref))));
    const tops = [F.deleteDoc(F.doc(db, "progress", s.id))];
    if (ledgerOK) tops.push(F.deleteDoc(F.doc(db, "private", s.id)));
    await Promise.all(tops.map(p => p.catch(e => console.warn("delete:", e))));
    await F.deleteDoc(F.doc(db, "students", s.id)); // last: if anything above failed, the student is still there
    if (ov) ov.remove();
    closeTab(s.id);
    await reload();
    toast(nm + " is verwijderd");
  } catch (e) { alert("Verwijderen mislukt: " + e.message); }
}

// ---------- lessons & payments ----------
function durationSelect(value) {
  const opts = DURATIONS.includes(+value) ? DURATIONS : DURATIONS.concat(+value).sort((a, b) => a - b);
  const sel = el("select", null, opts.map(m => el("option", { value: m }, m + " min")));
  sel.value = String(value || 60);
  return sel;
}

// Fields for one lesson and/or payment.
// mode "hw": one checkbox turns the whole block on/off (used inside the homework form).
// mode "entry": the checkbox says whether a lesson was given; the payment fields always show.
function lessonFields(s, entry, lessonOn, mode = "hw") {
  const pv = s.priv || {};
  const hadLesson = entry ? num(entry.price) > 0 || !!entry.duration : lessonOn;
  const on = el("input", { type: "checkbox" }); on.checked = mode === "hw" ? lessonOn : hadLesson;
  const dur = durationSelect((entry && entry.duration) || pv.duration || 60);
  const price = el("input", { inputmode: "decimal", value: entry && num(entry.price) ? entry.price : (pv.price ?? ""), placeholder: "€" });
  const paid = el("input", { inputmode: "decimal", value: entry && num(entry.paid) ? entry.paid : "", placeholder: "0" });
  const method = el("select", null, METHODS.map(m => el("option", { value: m }, m)));
  method.value = (entry && entry.method) || "Cash";
  const b = balance(s) + (entry ? num(entry.price) - num(entry.paid) : 0); // saldo before this entry
  const hint = el("p", { class: "small muted", style: "margin:6px 0 0" });
  const updHint = () => {
    const after = b + num(paid.value) - (mode === "entry" && !on.checked ? 0 : num(price.value));
    hint.textContent = "Saldo nu " + balanceText(b) + " → daarna " + balanceText(after);
  };
  const fullBtn = el("button", { class: "ghost small", type: "button", onclick: () => { paid.value = price.value; updHint(); } }, "= lesprijs");
  const lessonRow = el("div", { class: "grid2" },
    el("div", null, el("label", null, "Duur"), dur),
    el("div", null, el("label", null, "Lesprijs (€)"), price));
  const payRow = el("div", { class: "grid2" },
    el("div", null, el("label", null, "Vandaag betaald (€) ", fullBtn), paid),
    el("div", null, el("label", null, "Hoe"), method));
  const inner = el("div", null, mode === "hw" ? lessonRow : null, payRow, hint);
  const sync = () => {
    if (mode === "hw") inner.style.display = on.checked ? "" : "none";
    else lessonRow.style.display = on.checked ? "" : "none";
    updHint();
  };
  [on, price, paid].forEach(x => x.addEventListener("input", sync));
  on.addEventListener("change", sync);
  const box = el("fieldset", null,
    el("legend", null, "Les & betaling ", el("span", { class: "muted small", style: "font-weight:400" }, "(alleen voor jou)")),
    el("label", { class: "check" }, on, mode === "hw" ? "Les loggen in de boekhouding" : "Er was een les"),
    mode === "entry" ? lessonRow : null,
    inner);
  sync();
  return {
    box, on,
    values: () => {
      const lesson = mode === "hw" || on.checked;
      return { duration: lesson ? +dur.value : null, price: lesson ? num(price.value) : 0,
               paid: num(paid.value), method: num(paid.value) ? method.value : null };
    }
  };
}

function entryForm(s, existing, kind) {
  const isLesson = existing ? num(existing.price) > 0 || !!existing.duration : kind === "les";
  const date = el("input", { type: "date", value: existing ? existing.date : todayISO() });
  const f = lessonFields(s, existing, isLesson, "entry");
  const note = el("input", { value: existing ? existing.note || "" : "", placeholder: isLesson ? "bv. inhaalles, wat jullie deden" : "bv. 4 lessen vooraf" });
  const err = el("p", { class: "error" });
  const saveBtn = el("button", { class: "primary", onclick: save }, existing ? "Opslaan" : "Toevoegen");
  const ov = el("div", { class: "overlay" }, el("div", { class: "sheet" },
    el("h2", null, (existing ? "Wijzigen – " : (kind === "betaling" ? "Betaling – " : "Les – ")) + (s.name || s.id)),
    el("label", null, "Datum"), date,
    f.box,
    el("label", null, "Notitie ", el("span", { class: "muted" }, "(optioneel)")), note,
    existing && existing.hw ? el("p", { class: "small muted" }, "Hoort bij het huiswerk van " + dateLabel(existing.hw, "nl") + ".") : null,
    err,
    el("div", { class: "row", style: "margin-top:12px" }, saveBtn, el("button", { onclick: () => ov.remove() }, "Annuleren"))));
  document.body.append(ov);
  async function save() {
    const v = f.values();
    if (!v.price && !v.paid) { err.textContent = "Vul een lesprijs of een betaald bedrag in."; return; }
    const data = Object.assign(v, { date: date.value || todayISO(), note: note.value.trim(), updated: F.serverTimestamp() });
    if (existing && existing.hw) data.hw = existing.hw;
    saveBtn.disabled = true;
    try {
      if (existing) await F.setDoc(F.doc(db, "private", s.id, "lessen", existing.id), data);
      else await F.addDoc(F.collection(db, "private", s.id, "lessen"), data);
      ov.remove(); open[s.id] = true; await reload(); toast("Opgeslagen ✓");
    } catch (e) { saveBtn.disabled = false; err.textContent = "Opslaan mislukt: " + e.message; }
  }
}

async function removeEntry(s, e) {
  if (!confirm("Deze regel van " + dateLabel(e.date, "nl") + " (" + (s.name || s.id) + ") verwijderen? Dit kan niet ongedaan gemaakt worden.")) return;
  try { await F.deleteDoc(F.doc(db, "private", s.id, "lessen", e.id)); open[s.id] = true; await reload(); toast("Verwijderd"); }
  catch (err) { alert("Verwijderen mislukt: " + err.message); }
}

// ---------- one-time import from the old GitHub pages ----------
async function importOld() {
  if (!confirm("De " + OLD_STUDENTS.length + " leerlingen en hun huiswerk overnemen van de oude pagina's?")) return;
  app.append(el("p", { class: "muted" }, "Bezig met importeren…"));
  const fixPdf = p => (p && /^pdf\//.test(p) ? p : p); // PDFs are copied next to this page (huiswerk/pdf/)
  let n = 0;
  for (const id of OLD_STUDENTS) {
    try {
      const r = await fetch(OLD + "s/" + id + ".json", { cache: "no-store" });
      if (!r.ok) continue;
      const d = await r.json();
      await F.setDoc(F.doc(db, "students", id), { name: d.name || id, lang: d.lang || "nl" });
      for (const a of d.assignments || []) {
        const hid = String(a.id || a.date || Math.random().toString(36).slice(2)).replace(/\//g, "-");
        const copyA = JSON.parse(JSON.stringify(a));
        delete copyA.id;
        copyA.pdf = fixPdf(copyA.pdf);
        (copyA.exercises || []).forEach(ex => { ex.pdf = fixPdf(ex.pdf); if (ex.pdf == null) delete ex.pdf; });
        if (copyA.pdf == null) delete copyA.pdf;
        await F.setDoc(F.doc(db, "students", id, "homework", hid), copyA);
      }
      n++;
    } catch (e) { console.warn("import", id, e); }
  }
  await reload();
  toast(n + " leerlingen geïmporteerd ✓");
}

// ---------- data ----------
async function reload() {
  const snap = await F.getDocs(F.collection(db, "students"));
  ledgerOK = true;
  // money data is separate and teacher-only; old rules refuse it → show the rules banner, keep homework working
  const priv = async p => {
    try { return await p; }
    catch (e) { if (e.code === "permission-denied") { ledgerOK = false; return null; } throw e; }
  };
  const list = await Promise.all(snap.docs.map(async d => {
    const [hw, pv, ls] = await Promise.all([
      F.getDocs(F.collection(db, "students", d.id, "homework")),
      priv(F.getDoc(F.doc(db, "private", d.id))),
      priv(F.getDocs(F.collection(db, "private", d.id, "lessen")))]);
    const homework = hw.docs.map(h => Object.assign({ id: h.id }, h.data()))
      .sort((a, b) => (a.id < b.id ? 1 : a.id > b.id ? -1 : 0));
    const entries = ls ? ls.docs.map(e => Object.assign({ id: e.id }, e.data()))
      .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : (a.id < b.id ? 1 : -1))) : [];
    return Object.assign({ id: d.id }, d.data(), { homework, priv: (pv && pv.exists() && pv.data()) || {}, entries });
  }));
  students = list.sort((a, b) => (a.name || a.id).localeCompare(b.name || b.id));
  msgOK = true;
  await Promise.all(students.map(async s => {
    s.msgs = [];
    try {
      const ms = await F.getDocs(F.collection(db, "progress", s.id, "messages"));
      s.msgs = ms.docs.map(m => Object.assign({ id: m.id }, m.data())).sort((a, b) => (a.at < b.at ? -1 : 1));
    } catch (e) { if (e.code === "permission-denied") msgOK = false; else console.warn("messages:", e); }
  }));
  progress = {}; progressOK = true;
  try {
    const ps = await F.getDocs(F.collection(db, "progress"));
    ps.docs.forEach(p => { progress[p.id] = p.data(); });
  } catch (e) {
    if (e.code === "permission-denied") progressOK = false; else console.warn("progress:", e);
  }
  mainScreen();
}

async function signIn() {
  try { await A.signInWithPopup(auth, new A.GoogleAuthProvider()); }
  catch (e) {
    // popups can be blocked in a home-screen app → fall back to a full-page redirect
    if (/popup|operation-not-supported|web-storage/.test(e.code || "")) {
      try { return await A.signInWithRedirect(auth, new A.GoogleAuthProvider()); } catch (e2) { e = e2; }
    }
    signInScreen("Inloggen mislukt: " + e.message);
  }
}

// ---------- boot ----------
(async function () {
  if (!firebaseConfig) return setupScreen();
  const { initializeApp } = await import(FB + "firebase-app.js");
  A = await import(FB + "firebase-auth.js");
  F = await import(FB + "firebase-firestore.js");
  const fbApp = initializeApp(firebaseConfig);
  auth = A.getAuth(fbApp);
  db = F.getFirestore(fbApp);
  A.onAuthStateChanged(auth, async u => {
    user = u;
    if (!u) return signInScreen();
    try { await reload(); }
    catch (e) {
      if (e.code === "permission-denied") rulesScreen();
      else screen(el("p", { class: "error" }, "Fout bij laden: " + e.message));
    }
  });
})();
</script>
