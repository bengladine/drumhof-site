<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Drumhuiswerk</title>
<link rel="icon" href="/img/favicon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f6f4ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Drumhuiswerk">
<style>
  :root {
    --bg: #f6f4ef; --card: #fff; --ink: #1d1d1b; --muted: #6b6860;
    --accent: #e4572e; --ok: #2e9e5b; --line: #e3dfd6; --radius: 16px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; padding: 16px 14px 48px; }
  @media (min-width: 900px) {
    main { max-width: 860px; padding: 32px 24px 64px; }
    h1 { font-size: 2rem; }
    .goal { font-size: 2rem; }
    .step { gap: 16px; }
  }
  h1 { font-size: 1.5rem; margin: 8px 0 4px; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  .card {
    background: var(--card); border-radius: var(--radius);
    padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .label { font-size: .8rem; font-weight: 700; letter-spacing: .06em;
           text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
  .goal { font-size: 1.6rem; font-weight: 800; line-height: 1.2; margin: 0; }
  .goal.done { color: var(--ok); }
  .title { font-weight: 600; margin: 0 0 4px; }

  /* streak */
  .streak { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .streak-num { font-size: 2.2rem; font-weight: 800; }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day {
    border: 2px solid var(--line); background: #fff; border-radius: 12px;
    padding: 8px 0; text-align: center; font: inherit; font-size: .85rem; color: var(--ink);
    min-height: 56px;
  }
  .day b { display: block; font-size: 1.1rem; }
  .day.on { background: var(--ok); border-color: var(--ok); color: #fff; }
  .day.today { border-color: var(--ink); }
  .day:disabled { opacity: .35; }
  .big-btn {
    display: block; width: 100%; margin-top: 12px; padding: 16px;
    border: 0; border-radius: 14px; font: inherit; font-weight: 700; font-size: 1.1rem;
    background: var(--accent); color: #fff;
  }
  .big-btn.on { background: var(--ok); }

  /* audio + tempo */
  .groove-frame { width: 100%; height: 175px; border: 0; display: block; }
  .ext { display: inline-block; margin-top: 6px; color: var(--muted); font-size: .9rem; }
  .now-playing { font-size: .9rem; color: var(--muted); margin: 0 0 8px; }
  .step {
    display: flex; align-items: center; gap: 10px;
    border-top: 1px solid var(--line); padding: 10px 0;
  }
  .step:first-of-type { border-top: 0; }
  .play {
    flex: 0 0 auto; min-width: 104px; padding: 12px 14px; border-radius: 12px;
    border: 2px solid var(--ink); background: #fff; font: inherit; font-weight: 700; color: var(--ink);
  }
  .play.active { background: var(--ink); color: #fff; }
  .check { display: flex; align-items: center; gap: 10px; flex: 1; font-size: 1rem; cursor: pointer; }
  .check input { width: 30px; height: 30px; accent-color: var(--ok); }

  .pdf-btn {
    display: block; text-align: center; padding: 14px; border-radius: 14px;
    border: 2px solid var(--ink); color: var(--ink); text-decoration: none; font-weight: 700;
  }
  ul.focus { margin: 0; padding-left: 20px; }
  ul.focus li { margin: 4px 0; }
  .celebrate {
    background: var(--ok); color: #fff; border-radius: 12px; padding: 12px 14px;
    font-weight: 700; margin-top: 12px;
  }
  details.old { background: var(--card); border-radius: var(--radius); margin-bottom: 10px; }
  details.old > summary { padding: 14px 16px; font-weight: 600; cursor: pointer; }
  details.old > div { padding: 0 2px 2px; }
  details.ex { background: var(--card); border-radius: var(--radius); margin-bottom: 10px;
               box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  details.ex > summary { display: flex; align-items: center; gap: 12px; padding: 14px 16px;
                         cursor: pointer; list-style: none; }
  details.ex > summary::-webkit-details-marker { display: none; }
  .ex-mark { flex: 0 0 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
             font-weight: 800; border: 2px solid var(--ink); }
  details.ex.done .ex-mark { background: var(--ok); border-color: var(--ok); color: #fff; }
  .ex-type { display: block; font-size: .75rem; font-weight: 700; letter-spacing: .06em;
             text-transform: uppercase; color: var(--accent); }
  .ex-title { font-weight: 700; }
  .ex-body { padding: 0 6px 6px; }
  .ex-body .card { box-shadow: none; border: 1px solid var(--line); margin-bottom: 8px; }
  .zoom-btn { margin: 6px 12px 0 0; padding: 8px 12px; border-radius: 10px; border: 2px solid var(--ink);
              background: #fff; font: inherit; font-size: .9rem; font-weight: 700; color: var(--ink); }
  .overlay { position: fixed; inset: 0; z-index: 10; background: #fff; overflow: auto; padding: 8px 8px 24px; }
  .overlay-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  .overlay-bar .hint { color: var(--muted); font-size: .85rem; }
  @media (orientation: landscape) { .overlay-bar .hint { visibility: hidden; } }
  .overlay-bar button { padding: 10px 14px; border-radius: 10px; border: 0; background: var(--ink); color: #fff;
                        font: inherit; font-weight: 700; }
  .error { background: #fff; border-radius: var(--radius); padding: 20px; }
  /* messages to/from the teacher */
  .msgs .msg { border-radius: 12px; padding: 8px 12px; margin-bottom: 8px; max-width: 90%; }
  .msg.from-student { background: #efe9dc; margin-left: auto; }
  .msg.from-teacher { background: #e3f1e8; }
  .msg-who { display: block; font-size: .75rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .msg-text { white-space: pre-wrap; }
  .msg-new { background: var(--accent); color: #fff; border-radius: 99px; padding: 0 7px; margin-left: 6px; text-transform: none; letter-spacing: 0; }
  .ask-btn { font: inherit; font-weight: 700; background: none; border: 2px dashed var(--line); color: var(--ink);
             border-radius: 12px; padding: 10px 14px; width: 100%; cursor: pointer; text-align: left; }
  .msg-input { width: 100%; min-height: 80px; font: inherit; padding: 10px; border: 2px solid var(--line); border-radius: 12px; resize: vertical; }
  .msg-row { display: flex; gap: 8px; margin-top: 8px; }
  .send-btn { font: inherit; font-weight: 700; background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 9px 16px; cursor: pointer; }
  .cancel-btn { font: inherit; background: none; border: 0; color: var(--muted); cursor: pointer; }
  .msg-status { color: #b3261e; font-size: .9rem; margin: 6px 0 0; }
  .msg-toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ok); color: #fff;
               padding: 12px 18px; border-radius: 12px; font-weight: 700; z-index: 30; }
  .ask-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .ask-row .ask-btn { flex: 1 1 200px; width: auto; }
  .rec-box { background: var(--bg); border-radius: 12px; padding: 10px; }
  .rec-box audio, .clip audio { width: 100%; }
  .rec-live { font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .rec-dot { width: 12px; height: 12px; border-radius: 50%; background: #d92d20; animation: recblink 1s infinite; }
  @keyframes recblink { 50% { opacity: .2; } }
  .muted-tip { color: var(--muted); }
  .clip { margin-top: 6px; }
  .play-clip { font: inherit; font-weight: 700; border: 0; border-radius: 99px; padding: 6px 14px; background: var(--ink); color: #fff; cursor: pointer; }
  .msg-old { margin-bottom: 8px; }
  .msg-old summary { cursor: pointer; color: var(--ok); font-weight: 700; font-size: .9rem; margin-bottom: 6px; }
  .solve-btn { font: inherit; font-weight: 700; background: #e3f1e8; color: #1f6e40; border: 0; border-radius: 10px; padding: 8px 14px; cursor: pointer; margin-bottom: 8px; }
  .reply-banner { background: #e3f1e8; border-radius: 12px; padding: 10px 14px; font-weight: 700; margin-bottom: 12px; }
  /* teacher's read-only view (&leraar=1): ticks can't be changed */
  .view-banner { background: #1d1d1b; color: #f6f4ef; border-radius: 12px; padding: 10px 14px;
                 font-size: .9rem; font-weight: 600; margin-bottom: 12px; }
  .view-only .day, .view-only .big-btn, .view-only input[type=checkbox] { pointer-events: none; }
  .view-only .big-btn, .view-only .day:not(.on) { opacity: .55; }
</style>
</head>
<body>
<main id="app"><p class="sub">Laden…</p></main>

<script type="module">
import { firebaseConfig } from "./firebase-config.js";

// Old home of the homework (GitHub Pages): fallback data for students not in the database yet.
const OLD = "https://bengladine.github.io/drumhomework/";
// Groove player (Ben's Drumsheet embed). One place to change if the player moves.
const PLAYER = "https://drumsheet.app/GrooveEmbed.html";
const FB = "https://www.gstatic.com/firebasejs/10.14.1/";

(async function () {
  const app = document.getElementById("app");
  const code = (new URLSearchParams(location.search).get("s") || "").toLowerCase();

  // ---------- storage (on the student's phone) ----------
  const KEY = "drumhw:" + code;
  // Coming from the old page? It hands over the ticks/streak in the URL (#p=...), once.
  if (location.hash.startsWith("#p=")) {
    try {
      const incoming = JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(3)))));
      const mine = JSON.parse(localStorage.getItem(KEY) || "null");
      if (!mine || (!mine.days.length && !Object.keys(mine.tempos || {}).length)) {
        localStorage.setItem(KEY, JSON.stringify(incoming));
      }
    } catch (e) {}
    history.replaceState(null, "", location.pathname + location.search);
  }
  // Opened from the teacher page ("Bekijk", &leraar=1): show the student's ticks from the database,
  // read-only. Nothing is ticked, saved or counted as "opened" from the teacher's device.
  const VIEW = new URLSearchParams(location.search).has("leraar");
  if (VIEW) document.body.classList.add("view-only");
  function load() {
    if (VIEW) return { days: [], tempos: {}, opened: [] };
    try { return JSON.parse(localStorage.getItem(KEY)) || { days: [], tempos: {}, opened: [] }; }
    catch (e) { return { days: [], tempos: {}, opened: [] }; }
  }
  function saveLocal(state) {
    if (VIEW) return;
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }
  function save(state) {
    if (VIEW) return;
    // Every change is still kept on this phone first; "dirty" = not yet in the database.
    state.dirty = true; saveLocal(state); pushProgress();
  }
  let state = load();
  state.opened = state.opened || [];

  // ---------- practice sync (database, so ticks show up on every device + on the teacher page) ----------
  // No accounts: the student's link (?s=code) is the key. progress/<code> = { days, tempos, updated }.
  // The database is the truth once this phone has synced; changes made while offline ("dirty")
  // are merged in (union) the next time, so nothing ticked is ever lost.
  let dbP = null;
  function getDb() {
    if (!firebaseConfig) return Promise.resolve(null);
    return dbP = dbP || (async () => {
      const { initializeApp } = await import(FB + "firebase-app.js");
      const app = initializeApp(firebaseConfig);
      let auth = null;
      if (VIEW) {
        const A = await import(FB + "firebase-auth.js");
        auth = A.getAuth(app);
        await auth.authStateReady();
      }
      const L = await import(FB + "firebase-firestore-lite.js");
      return { L, app, auth, db: L.getFirestore(app) };
    })();
  }
  const union = (a, b) => Array.from(new Set((a || []).concat(b || []))).sort();
  function mergeInto(local, cloud) {
    const tempos = Object.assign({}, cloud.tempos);
    Object.keys(local.tempos || {}).forEach(k => { tempos[k] = union(tempos[k], local.tempos[k]); });
    return { days: union(local.days, cloud.days), tempos, opened: union(local.opened, cloud.opened) };
  }
  async function pushProgress() {
    if (VIEW) return;
    try {
      const f = await getDb(); if (!f) return;
      await f.L.setDoc(f.L.doc(f.db, "progress", code),
        { days: state.days, tempos: state.tempos || {}, opened: (state.opened || []).slice(-400),
          updated: new Date().toISOString() });
      state.dirty = false; state.synced = true; saveLocal(state);
    } catch (e) { console.warn("progress push:", e); }
  }
  async function pullProgress() {
    try {
      const f = await getDb(); if (!f) return false;
      const snap = await f.L.getDoc(f.L.doc(f.db, "progress", code));
      const cloud = snap.exists() ? snap.data() : null;
      const before = JSON.stringify([state.days, state.tempos]);
      const needsPush = !VIEW && (state.dirty || !state.synced);
      let next;
      if (!cloud) next = { days: state.days, tempos: state.tempos, opened: state.opened };
      else if (needsPush) next = mergeInto(state, cloud);
      else next = { days: cloud.days || [], tempos: cloud.tempos || {}, opened: cloud.opened || [] };
      state.days = next.days; state.tempos = next.tempos || {}; state.opened = next.opened || [];
      // Count today as "opened the app" (shown to the teacher), once per day
      let changed = needsPush;
      if (!VIEW && !state.opened.includes(todayKey)) { state.opened.push(todayKey); changed = true; }
      if (!VIEW) { state.synced = state.synced || !!cloud; saveLocal(state); }
      if (changed) await pushProgress();
      return JSON.stringify([state.days, state.tempos]) !== before;
    } catch (e) { console.warn("progress pull:", e); return false; }
  }

  // ---------- dates ----------
  const pad = n => String(n).padStart(2, "0");
  const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const todayKey = ymd(today);

  function streak() {
    const days = new Set(state.days);
    // Today not done yet? Streak still counts up to yesterday.
    let d = days.has(todayKey) ? today : addDays(today, -1);
    let n = 0;
    while (days.has(ymd(d))) { n++; d = addDays(d, -1); }
    return n;
  }
  function toggleDay(key) {
    if (VIEW) return;
    const i = state.days.indexOf(key);
    if (i >= 0) state.days.splice(i, 1); else state.days.push(key);
    save(state); render();
  }

  // ---------- Groove Scribe ----------
  // Turn a normal Groove Scribe link into the compact embed at a given tempo.
  function grooveEmbed(url, bpm) {
    const q = url.split("?")[1] || "";
    let query = /(^|&)Tempo=\d+/.test(q)
      ? q.replace(/((?:^|&)Tempo=)\d+/, "$1" + bpm)
      : q + "&Tempo=" + bpm;
    // every groove plays in Ben's own player (Drumsheet, copy in editor/). Old Groove Scribe links
    // (mikeslessons.com) use the same link format, so they play there too.
    return PLAYER + "?" + query;
  }

  // Estimate how many staff lines Groove Scribe draws: in 4/4 it puts one bar per line,
  // in shorter meters (3/4, …) two. Override per groove with "lines" in the JSON if it's off.
  function grooveLines(url) {
    const bars = +((url.match(/[?&]Measures=(\d+)/) || [])[1]) || 1;
    const four = /[?&]TimeSig=4\//.test(url) || !/[?&]TimeSig=/.test(url);
    return four ? bars : Math.ceil(bars / 2);
  }
  // Notation scales with width: measured ≈ 0.13 × width per staff line, plus ~70px for the
  // play controls. A little margin on top so nothing hides behind an inner scrollbar.
  function sizeFrames() {
    document.querySelectorAll("iframe.groove-frame").forEach(f => {
      const lines = +f.dataset.lines || 1;
      // sticking letters (R/L) above the notes make each line taller
      const extra = /[?&]Stickings=[^&]*[RLB]/.test(decodeURIComponent(f.src)) ? 20 : 0;
      f.style.height = Math.round(85 + (0.14 * f.offsetWidth + extra) * lines) + "px";
    });
  }
  window.addEventListener("resize", sizeFrames);

  // Only one groove plays at a time. The player is on another site, so we can't pause it;
  // instead we notice which player got the click (focus moves into its iframe) and
  // reload the previously used one, which stops its sound.
  let activeFrame = null;
  window.addEventListener("blur", () => setTimeout(() => {
    const f = document.activeElement;
    if (!f || !f.classList || !f.classList.contains("groove-frame")) return;
    if (activeFrame && activeFrame !== f && document.contains(activeFrame)) {
      activeFrame.src = activeFrame.src;
    }
    activeFrame = f;
    f.blur(); window.focus(); // give focus back to the page so the next player click is noticed too
  }, 0));
  document.addEventListener("toggle", sizeFrames, true);

  // Full-screen view of one groove (bigger notation, esp. with the phone sideways)
  function openLarge(g, bpm) {
    const ov = el("div", { class: "overlay" },
      el("div", { class: "overlay-bar" },
        el("span", { class: "hint" }, T("rotate")),
        el("button", { onclick: () => ov.remove() }, T("close"))),
      el("iframe", { class: "groove-frame", title: g.label || "Groove",
        "data-lines": g.lines || grooveLines(g.url), src: grooveEmbed(g.url, bpm) }));
    document.body.append(ov);
    sizeFrames();
  }

  // ---------- helpers ----------
  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    for (const k in attrs || {}) {
      if (k === "class") n.className = attrs[k];
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    }
    for (const k of kids.flat()) if (k != null) n.append(k);
    return n;
  }

  // ---------- labels (per student: "lang": "en" in their file; default Dutch) ----------
  const LABELS = {
    nl: { hi: "Hoi", intro: "Dit is je drumhuiswerk.", none: "Nog geen opdracht.", previous: "Vorige opdrachten",
          days: ["ma", "di", "wo", "do", "vr", "za", "zo"], streak1: "dag op rij geoefend", streakN: "dagen op rij geoefend",
          doneToday: "✓ Vandaag geoefend!", practiceToday: "Ik heb vandaag geoefend", thisWeek: "Deze week",
          goalsDone: (d, n) => d + " van " + n + " doelen gehaald", allDone: "🎉 Alles gehaald! Laat het zien in de les.",
          pdf: "📄 Open de noten (PDF)", goal: "Jouw doel", done: "Gelukt", doneAt: "Gelukt op",
          goalDone: "🎉 Doel gehaald! Laat het zien in de les.", listen: "Luister & speel mee",
          tempoNow: b => "Tempo nu: " + b + " bpm — druk op ▶ in de noten", focus: "Let op",
          zoom: "🔍 Groter bekijken", close: "✕ Sluiten", rotate: "Tip: draai je gsm",
          ask: "💬 Vraag of opmerking voor je leraar", askPh: "Bv. de fill in maat 4 lukt nog niet…",
          send: "Versturen", cancel: "Annuleren", you: "Jij", teacher: "Leraar", isNew: "nieuw",
          sent: "Verstuurd ✓ Je leraar ziet het.", sendFail: "Versturen lukte niet. Probeer later opnieuw.",
          replied: "💬 Je leraar heeft geantwoord — kijk bij de oefening.",
          rec: "🎙️ Opname sturen", recNow: "Opnemen…", recStop: "■ Stop", recAgain: "Opnieuw",
          recPlay: "▶ Opname", recNoMic: "Geen toegang tot je microfoon. Sta het toe in je browser en probeer opnieuw.",
          recTip: "Leg je gsm een paar meter van je drums. Max 1 minuut.",
          solved: "✓ Opgelost", solvedOld: n => "✓ Opgelost (" + n + " bericht" + (n === 1 ? "" : "en") + ")" },
    en: { hi: "Hi", intro: "This is your drum homework.", none: "No homework yet.", previous: "Previous homework",
          days: ["Mo", "Tu", "We", "Th", "Fr", "Sa", "Su"], streak1: "day in a row", streakN: "days in a row",
          doneToday: "✓ Practised today!", practiceToday: "I practised today", thisWeek: "This week",
          goalsDone: (d, n) => d + " of " + n + " goals reached", allDone: "🎉 All done! Show it in your next lesson.",
          pdf: "📄 Open the sheet music (PDF)", goal: "Your goal", done: "Done", doneAt: "Done at",
          goalDone: "🎉 Goal reached! Show it in your next lesson.", listen: "Listen & play along",
          tempoNow: b => "Tempo now: " + b + " bpm — press ▶ in the notation", focus: "Focus on",
          zoom: "🔍 View larger", close: "✕ Close", rotate: "Tip: turn your phone sideways",
          ask: "💬 Question or note for your teacher", askPh: "E.g. the fill in bar 4 doesn't work yet…",
          send: "Send", cancel: "Cancel", you: "You", teacher: "Teacher", isNew: "new",
          sent: "Sent ✓ Your teacher will see it.", sendFail: "Couldn't send. Please try again later.",
          replied: "💬 Your teacher replied — see the exercise.",
          rec: "🎙️ Send a recording", recNow: "Recording…", recStop: "■ Stop", recAgain: "Again",
          recPlay: "▶ Recording", recNoMic: "No access to your microphone. Allow it in your browser and try again.",
          recTip: "Put your phone a few metres from your drums. Max 1 minute.",
          solved: "✓ Solved", solvedOld: n => "✓ Solved (" + n + " message" + (n === 1 ? "" : "s") + ")" }
  };
  const T = k => (LABELS[(data && data.lang) || "nl"] || LABELS.nl)[k];

  // ---------- render ----------
  let data = null;
  const playing = {}; // assignment id -> bpm currently loaded

  function render() {
    renderPage();
    sizeFrames();
  }
  function renderPage() {
    app.textContent = "";
    if (VIEW) app.append(el("div", { class: "view-banner" },
      "👀 Leraar-weergave: je ziet wat " + (data.name || code) + " aanvinkte. Aanvinken kan hier niet, antwoorden op vragen wel."));
    if (newReplies()) app.append(el("div", { class: "reply-banner" }, T("replied")));
    app.append(el("h1", null, T("hi") + " " + (data.name || "") + " 👋"));
    app.append(el("p", { class: "sub" }, T("intro")));
    app.append(streakCard());

    const list = data.assignments || [];
    if (!list.length) { app.append(el("p", { class: "sub" }, T("none"))); return; }
    app.append(assignmentView(list[0]));

    if (list.length > 1) {
      app.append(el("p", { class: "label", style: "margin-top:24px" }, T("previous")));
      for (const a of list.slice(1)) {
        app.append(el("details", { class: "old" },
          el("summary", null, (a.date ? a.date + " · " : "") + (a.title || a.goal)),
          el("div", null, assignmentView(a))));
      }
    }
  }

  function streakCard() {
    const s = streak();
    const doneToday = state.days.includes(todayKey);
    const monday = addDays(today, -((today.getDay() + 6) % 7));
    const names = T("days");
    const week = el("div", { class: "week" });
    names.forEach((nm, i) => {
      const d = addDays(monday, i), key = ymd(d);
      week.append(el("button", {
        class: "day" + (state.days.includes(key) ? " on" : "") + (key === todayKey ? " today" : ""),
        ...(d > today ? { disabled: "" } : {}),
        "aria-label": nm + " " + d.getDate(),
        onclick: () => toggleDay(key)
      }, nm, el("b", null, state.days.includes(key) ? "✓" : String(d.getDate()))));
    });
    return el("section", { class: "card" },
      el("div", { class: "streak" },
        el("span", { class: "streak-num" }, "🔥 " + s),
        el("span", null, s === 1 ? T("streak1") : T("streakN"))),
      week,
      el("button", {
        class: "big-btn" + (doneToday ? " on" : ""),
        onclick: () => toggleDay(todayKey)
      }, doneToday ? T("doneToday") : T("practiceToday")));
  }

  // A week's homework is either one exercise (old format) or a list in "exercises".
  const openEx = {}; // which exercises are unfolded (survives re-render)
  function isDone(ex, id) {
    // No tempo steps? Then a single "done" tick counts.
    const t = (ex.tempos && ex.tempos.length) ? ex.tempos : ["done"], d = state.tempos[id] || [];
    return t.every(x => d.includes(x));
  }
  function assignmentView(a) {
    const baseId = a.id || a.title || a.goal;
    if (!Array.isArray(a.exercises)) return exerciseView(a, baseId, a.title || a.goal);

    const exs = a.exercises;
    const ids = exs.map((ex, i) => baseId + "/" + (ex.id || i));
    const doneCount = exs.filter((ex, i) => isDone(ex, ids[i])).length;
    const wrap = el("div");
    wrap.append(el("section", { class: "card" },
      el("p", { class: "label" }, T("thisWeek")),
      a.title ? el("p", { class: "goal", style: "font-size:1.3rem" }, a.title) : null,
      el("p", { class: "sub", style: "margin:6px 0 0" }, T("goalsDone")(doneCount, exs.length)),
      a.notes ? el("ul", { class: "focus", style: "margin-top:10px" },
        (Array.isArray(a.notes) ? a.notes : [a.notes]).map(n => el("li", null, n))) : null,
      doneCount === exs.length ? el("div", { class: "celebrate" }, T("allDone")) : null,
      a.pdf ? el("a", { class: "pdf-btn", style: "margin-top:12px", href: a.pdf, target: "_blank", rel: "noopener" }, T("pdf")) : null));

    exs.forEach((ex, i) => {
      const id = ids[i], done = isDone(ex, id);
      const d = el("details", { class: "ex" + (done ? " done" : ""), ...(openEx[id] ? { open: "" } : {}) },
        el("summary", null,
          el("span", { class: "ex-mark" }, done ? "✓" : String(i + 1)),
          el("span", null,
            ex.type ? el("span", { class: "ex-type" }, ex.type) : null,
            el("span", { class: "ex-title" }, ex.title || ex.goal))),
        el("div", { class: "ex-body" }, exerciseView(Object.assign({}, ex, { title: null }), id, ex.title || ex.goal)));
      d.addEventListener("toggle", () => { openEx[id] = d.open; });
      wrap.append(d);
    });
    return wrap;
  }

  function exerciseView(a, id, exTitle) {
    const tempos = a.tempos || [];
    const done = state.tempos[id] || [];
    const allDone = isDone(a, id);
    const wrap = el("div");
    const toggleTick = t => {
      if (VIEW) return render();
      const arr = state.tempos[id] = state.tempos[id] || [];
      const i = arr.indexOf(t);
      if (i >= 0) arr.splice(i, 1); else arr.push(t);
      save(state); render();
    };

    // 1. The goal
    wrap.append(el("section", { class: "card" },
      el("p", { class: "label" }, T("goal")),
      a.title ? el("p", { class: "title" }, a.title) : null,
      el("p", { class: "goal" + (allDone ? " done" : "") }, a.goal),
      !tempos.length ? el("label", { class: "check", style: "margin-top:12px" },
        el("input", { type: "checkbox", ...(allDone ? { checked: "" } : {}), onchange: () => toggleTick("done") }),
        allDone ? T("done") + " ✓" : T("done")) : null,
      allDone ? el("div", { class: "celebrate" }, T("goalDone")) : null));

    // 2. Focus notes (above the audio, so they read it before they start)
    if (a.focus && a.focus.length) {
      const items = Array.isArray(a.focus) ? a.focus : [a.focus];
      wrap.append(el("section", { class: "card" },
        el("p", { class: "label" }, T("focus")),
        el("ul", { class: "focus" }, items.map(f => el("li", null, f)))));
    }

    // 3. Listen + tempo steps
    // "groove" can be one URL, or a list of {label, url} for multi-part exercises
    const grooves = !a.groove ? [] : Array.isArray(a.groove) ? a.groove : [{ url: a.groove }];
    if (grooves.length || tempos.length) {
      const bpm = playing[id] || tempos[0] || 80;
      const card = el("section", { class: "card" }, el("p", { class: "label" }, T("listen")));
      if (grooves.length) {
        card.append(el("p", { class: "now-playing" }, T("tempoNow")(bpm)));
        grooves.forEach(g => {
          if (g.label) card.append(el("p", { class: "title", style: "margin-top:10px" }, g.label));
          card.append(el("iframe", {
            class: "groove-frame", loading: "lazy", title: g.label || "Groove",
            "data-lines": g.lines || grooveLines(g.url),
            src: grooveEmbed(g.url, bpm)
          }));
          card.append(el("button", { class: "zoom-btn", onclick: () => openLarge(g, bpm) }, T("zoom")));
          card.append(el("a", { class: "ext", href: "https://drumsheet.app/?" + (g.url.split("?")[1] || ""), target: "_blank", rel: "noopener" }, "Open in Drumsheet ↗"));
        });
      }
      tempos.forEach(t => {
        const checked = done.includes(t);
        const box = el("input", {
          type: "checkbox", ...(checked ? { checked: "" } : {}),
          onchange: () => toggleTick(t)
        });
        card.append(el("div", { class: "step" },
          grooves.length ? el("button", {
            class: "play" + (t === bpm ? " active" : ""),
            onclick: () => { playing[id] = t; render(); }
          }, "▶ " + t) : el("strong", { style: "min-width:80px" }, t + " bpm"),
          el("label", { class: "check" }, box, checked ? T("done") + " ✓" : T("doneAt") + " " + t)));
      });
      wrap.append(card);
    }

    // 4. Notation
    if (a.pdf) {
      wrap.append(el("section", { class: "card" },
        el("a", { class: "pdf-btn", href: a.pdf, target: "_blank", rel: "noopener" }, T("pdf"))));
    }
    // 5. Questions / notes for the teacher, and the teacher's replies
    wrap.append(messageCard(id, exTitle));
    return wrap;
  }

  // ---------- messages (progress/<code>/messages): student <-> teacher, per exercise ----------
  let msgs = [];          // [{ id, from: "student"|"teacher", text, ex, exTitle, at }]
  const drafts = {};      // exercise id -> text being typed (survives re-render)
  const MSG_SEEN = "drumhw-msgseen:" + code;
  let msgSeen = "";
  try { msgSeen = VIEW ? "9999" : (localStorage.getItem(MSG_SEEN) || ""); } catch (e) {}
  async function loadMessages() {
    try {
      const f = await getDb(); if (!f) return false;
      const sn = await f.L.getDocs(f.L.collection(f.db, "progress", code, "messages"));
      const next = sn.docs.map(d => Object.assign({ id: d.id }, d.data())).sort((a, b) => (a.at < b.at ? -1 : 1));
      const changed = JSON.stringify(next) !== JSON.stringify(msgs);
      msgs = next;
      return changed;
    } catch (e) { console.warn("messages:", e); return false; }
  }
  function markRepliesSeen() {
    if (VIEW) return;
    const last = msgs.filter(m => m.from === "teacher").map(m => m.at).sort().pop();
    if (last && last > msgSeen) { try { localStorage.setItem(MSG_SEEN, last); } catch (e) {} }
  }
  const newReplies = () => msgs.some(m => m.from === "teacher" && m.at > msgSeen);
  // One conversation per exercise. A message marked "solved" closes that round: it folds away and
  // a new question starts a fresh round. In the teacher view (&leraar=1) you answer as the teacher.
  function messageCard(id, exTitle) {
    const thread = msgs.filter(m => m.ex === id);
    const rounds = [[]];
    thread.forEach(m => { rounds[rounds.length - 1].push(m); if (m.solved) rounds.push([]); });
    const current = rounds.pop();
    const who = m => VIEW ? (m.from === "teacher" ? "Jij" : (data.name || code)) : (m.from === "teacher" ? T("teacher") : T("you"));
    const bubble = m => el("div", { class: "msg " + (m.from === "teacher" ? "from-teacher" : "from-student") },
      el("span", { class: "msg-who" }, who(m),
        !VIEW && m.from === "teacher" && m.at > msgSeen ? el("span", { class: "msg-new" }, T("isNew")) : null),
      m.text ? el("span", { class: "msg-text" }, m.text) : null,
      m.clip ? clipPlayer(m) : null);
    const card = el("section", { class: "card msgs" });
    rounds.forEach(r => card.append(el("details", { class: "msg-old" },
      el("summary", null, T("solvedOld")(r.length)), r.map(bubble))));
    current.forEach(m => card.append(bubble(m)));
    if (current.length && drafts[id] == null) {
      const last = current[current.length - 1];
      const solve = el("button", { class: "solve-btn" }, T("solved"));
      solve.addEventListener("click", async () => {
        solve.disabled = true;
        try {
          const f = await getDb(); if (!f) throw new Error("offline");
          await f.L.updateDoc(f.L.doc(f.db, "progress", code, "messages", last.id), { solved: true });
          last.solved = true; render(); notifyTeacherPage();
        } catch (e) { console.warn("solve:", e); solve.disabled = false; toastMsg(T("sendFail")); }
      });
      card.append(el("div", { class: "msg-row" }, solve));
    }
    if (recs[id]) { card.append(recorderView(id, exTitle)); return card; }
    if (drafts[id] == null) {
      card.append(el("div", { class: "ask-row" },
        el("button", { class: "ask-btn", onclick: () => { drafts[id] = ""; render(); } },
          VIEW ? (current.length ? "↩︎ Antwoorden" : "✉️ Iets sturen") : T("ask")),
        el("button", { class: "ask-btn rec-btn", onclick: () => startRec(id) }, T("rec"))));
      return card;
    }
    const ta = el("textarea", { class: "msg-input", maxlength: "1000", placeholder: VIEW ? "Je antwoord…" : T("askPh") });
    ta.value = drafts[id];
    ta.addEventListener("input", () => { drafts[id] = ta.value; });
    const status = el("p", { class: "msg-status" });
    const send = el("button", { class: "send-btn" }, T("send"));
    send.addEventListener("click", async () => {
      const text = ta.value.trim(); if (!text) return ta.focus();
      send.disabled = true;
      try {
        const f = await getDb(); if (!f) throw new Error("offline");
        if (VIEW && !(f.auth && f.auth.currentUser)) {
          send.disabled = false; status.textContent = "Log eerst in op de leraarpagina, dan kan je hier antwoorden."; return;
        }
        const m = { from: VIEW ? "teacher" : "student", text, ex: id, exTitle: exTitle || "", at: new Date().toISOString() };
        const ref = await f.L.addDoc(f.L.collection(f.db, "progress", code, "messages"), m);
        msgs.push(Object.assign({ id: ref.id }, m));
        delete drafts[id]; render(); notifyTeacherPage();
        toastMsg(VIEW ? "Antwoord verstuurd ✓" : T("sent"));
      } catch (e) { console.warn("send:", e); send.disabled = false; status.textContent = T("sendFail"); }
    });
    const cancel = el("button", { class: "cancel-btn" }, T("cancel"));
    cancel.addEventListener("click", () => { delete drafts[id]; render(); });
    card.append(ta, el("div", { class: "msg-row" }, send, cancel), status);
    return card;
  }
  // ---------- audio recordings ----------
  // Recorded in the browser (max 60 s, ~48 kbit/s ≈ 360 KB), stored in the database as
  // progress/<code>/clips/<id> {data (base64), mime, from, at}; the message only points to it (clip, dur),
  // so opening the page doesn't download every recording. Drum-friendly: no noise suppression / auto gain.
  const MAX_REC = 60;
  const recs = {};     // exercise id -> { phase: "rec"|"review", mr, stream, chunks, t0, timer, blob, url, secs, mime }
  const clipCache = {};
  function pickMime() {
    if (!window.MediaRecorder) return null;
    for (const m of ["audio/mp4", "audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus"])
      if (MediaRecorder.isTypeSupported(m)) return m;
    return "";
  }
  async function startRec(id) {
    const mime = pickMime();
    if (mime == null) { toastMsg(T("recNoMic")); return; }
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    } catch (e) { console.warn("mic:", e); toastMsg(T("recNoMic")); return; }
    const mr = new MediaRecorder(stream, Object.assign({ audioBitsPerSecond: 48000 }, mime ? { mimeType: mime } : {}));
    const r = recs[id] = { phase: "rec", mr, stream, chunks: [], t0: Date.now(), mime: mr.mimeType || mime || "audio/webm" };
    mr.ondataavailable = e => { if (e.data && e.data.size) r.chunks.push(e.data); };
    mr.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      clearInterval(r.timer);
      if (recs[id] !== r) return; // cancelled
      r.secs = Math.max(1, Math.round((Date.now() - r.t0) / 1000));
      r.blob = new Blob(r.chunks, { type: r.mime });
      r.url = URL.createObjectURL(r.blob);
      r.phase = "review"; render();
    };
    mr.start(1000);
    r.timer = setInterval(() => {
      const sec = Math.floor((Date.now() - r.t0) / 1000);
      const n = document.getElementById("rec-time-" + cssId(id));
      if (n) n.textContent = mmss(sec) + " / " + mmss(MAX_REC);
      if (sec >= MAX_REC && mr.state === "recording") mr.stop();
    }, 250);
    render();
  }
  const mmss = n => Math.floor(n / 60) + ":" + String(n % 60).padStart(2, "0");
  const cssId = id => String(id).replace(/[^a-z0-9]/gi, "_");
  function cancelRec(id) {
    const r = recs[id]; delete recs[id];
    if (r && r.mr.state === "recording") r.mr.stop();
    if (r && r.url) URL.revokeObjectURL(r.url);
    render();
  }
  function recorderView(id, exTitle) {
    const r = recs[id];
    if (r.phase === "rec") {
      return el("div", { class: "rec-box" },
        el("div", { class: "rec-live" }, el("span", { class: "rec-dot" }), T("recNow"), " ",
          el("span", { id: "rec-time-" + cssId(id) }, mmss(Math.floor((Date.now() - r.t0) / 1000)) + " / " + mmss(MAX_REC))),
        el("p", { class: "msg-status muted-tip" }, T("recTip")),
        el("div", { class: "msg-row" },
          el("button", { class: "send-btn", onclick: () => r.mr.state === "recording" && r.mr.stop() }, T("recStop")),
          el("button", { class: "cancel-btn", onclick: () => cancelRec(id) }, T("cancel"))));
    }
    const status = el("p", { class: "msg-status" });
    const send = el("button", { class: "send-btn" }, T("send"));
    send.addEventListener("click", async () => {
      send.disabled = true;
      try {
        const f = await getDb(); if (!f) throw new Error("offline");
        if (VIEW && !(f.auth && f.auth.currentUser)) { send.disabled = false; status.textContent = "Log eerst in op de leraarpagina."; return; }
        const data = await new Promise((ok, bad) => { const fr = new FileReader(); fr.onload = () => ok(String(fr.result).split(",")[1]); fr.onerror = bad; fr.readAsDataURL(r.blob); });
        if (data.length > 950000) throw new Error("too long");
        const from = VIEW ? "teacher" : "student", at = new Date().toISOString();
        const c = await f.L.addDoc(f.L.collection(f.db, "progress", code, "clips"), { data, mime: r.mime, from, at });
        const m = { from, text: "", ex: id, exTitle: exTitle || "", at, clip: c.id, dur: r.secs };
        const ref = await f.L.addDoc(f.L.collection(f.db, "progress", code, "messages"), m);
        clipCache[c.id] = r.url; msgs.push(Object.assign({ id: ref.id }, m));
        delete recs[id]; render(); notifyTeacherPage();
        toastMsg(VIEW ? "Opname verstuurd ✓" : T("sent"));
      } catch (e) { console.warn("send clip:", e); send.disabled = false; status.textContent = T("sendFail"); }
    });
    return el("div", { class: "rec-box" },
      el("audio", { controls: "", src: r.url, preload: "metadata" }),
      el("div", { class: "msg-row" }, send,
        el("button", { class: "cancel-btn", onclick: () => { cancelRec(id); startRec(id); } }, T("recAgain")),
        el("button", { class: "cancel-btn", onclick: () => cancelRec(id) }, T("cancel"))),
      status);
  }
  function clipPlayer(m) {
    const box = el("div", { class: "clip" });
    const show = url => { box.textContent = ""; const a = el("audio", { controls: "", src: url, preload: "auto" }); box.append(a); a.play().catch(() => {}); };
    if (clipCache[m.clip]) { box.append(el("audio", { controls: "", src: clipCache[m.clip], preload: "metadata" })); return box; }
    const btn = el("button", { class: "play-clip" }, T("recPlay") + (m.dur ? " · " + mmss(m.dur) : ""));
    btn.addEventListener("click", async () => {
      btn.disabled = true; btn.textContent = "…";
      try {
        const f = await getDb();
        const d = await f.L.getDoc(f.L.doc(f.db, "progress", code, "clips", m.clip));
        if (!d.exists()) throw new Error("gone");
        const c = d.data();
        clipCache[m.clip] = "data:" + (c.mime || "audio/webm").split(";")[0] + ";base64," + c.data;
        show(clipCache[m.clip]);
      } catch (e) { console.warn("clip:", e); btn.textContent = "—"; }
    });
    box.append(btn);
    return box;
  }

  // Inside a tab of the teacher page: tell it to refresh the list when you go back to it
  function notifyTeacherPage() {
    try { if (window.parent !== window) window.parent.postMessage({ type: "drumhw-changed", code }, location.origin); } catch (e) {}
  }
  function toastMsg(t) {
    const n = el("div", { class: "msg-toast" }, t); document.body.append(n); setTimeout(() => n.remove(), 3000);
  }

  // ---------- boot ----------
  if (!code || !/^[a-z0-9]+$/i.test(code)) {
    app.innerHTML = '<div class="error">Deze link klopt niet. Vraag je drumleraar om de juiste link.</div>';
    return;
  }
  // 1) the database (homework Ben adds on the teacher page); 2) else the old JSON file on GitHub
  async function fromDatabase() {
    const f = await getDb();
    if (!f) return null;
    const { L, db } = f;
    const s = await L.getDoc(L.doc(db, "students", code));
    if (!s.exists()) return null;
    const hw = await L.getDocs(L.collection(db, "students", code, "homework"));
    const assignments = hw.docs.map(d => Object.assign({ id: d.id }, d.data()))
      .sort((a, b) => (a.id < b.id ? 1 : a.id > b.id ? -1 : 0));
    return Object.assign({}, s.data(), { assignments });
  }
  async function fromOldFile() {
    const r = await fetch(OLD + "s/" + code + ".json", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    const fix = p => (p && !/^https?:/.test(p) ? OLD + p : p);
    (d.assignments || []).forEach(a => {
      a.pdf = fix(a.pdf);
      (a.exercises || []).forEach(ex => { ex.pdf = fix(ex.pdf); });
    });
    return d;
  }
  try {
    // Old GitHub file only when the database can't be reached (or isn't connected). A student that
    // isn't in the database (e.g. deleted on the teacher page) gets "not found", not their old homework.
    let dbOK = !!firebaseConfig;
    try { data = await fromDatabase(); } catch (e) { dbOK = false; console.warn("database:", e); }
    if (!data && !dbOK) data = await fromOldFile();
    if (!data) throw new Error("not found");
    document.documentElement.lang = data.lang || "nl";
    render();
    // Ticks + messages from other devices: fetch now and whenever the app comes back to the front.
    const refresh = async () => {
      const [a, b] = await Promise.all([pullProgress(), loadMessages()]);
      if (a || b) render();
      markRepliesSeen(); // "new" labels stay visible until the next visit
    };
    await refresh();
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(); });
  } catch (e) {
    app.innerHTML = '<div class="error">Huiswerk niet gevonden. Vraag je drumleraar om de juiste link.</div>';
  }
})();
</script>
</body>
</html>
